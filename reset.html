<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Content | Riwayat Jewels</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream-dark);">
  <div style="text-align:center;max-width:420px;padding:40px;">
    <h1 style="font-size:26px;margin-bottom:16px;" id="msg">Restoring original site…</h1>
    <p style="color:var(--text-muted);margin-bottom:24px;">This removes any admin edits saved in this browser and restores every page exactly as originally built.</p>
    <a href="index.html" class="btn btn-primary">Go to Homepage</a>
  </div>
  <script>
    localStorage.removeItem('riwayat_content');
    document.getElementById('msg').textContent = 'Done — original site restored in this browser.';
  </script>
</body>
</html>
